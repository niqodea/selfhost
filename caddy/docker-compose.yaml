services:
  caddy:
    build: .
    networks:
      main:
        gw_priority: 1
        ipv4_address: ${MAIN_NETWORK_CADDY_ADDRESS}
      caddy:
    volumes:
      - ./volumes/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - DYNU_API_KEY=${DYNU_API_KEY}
    restart: ${DOCKER_RESTART}

networks:
  caddy:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${CADDY_NETWORK}
  main:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${MAIN_NETWORK}

volumes:
  caddy-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/data
  caddy-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/config
