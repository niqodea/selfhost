services:
  caddy:
    build: .
    dns: ${INTERNET_NETWORK_DNS_ADDRESS}
    networks:
      internet:
        gw_priority: 1
      peers:
        ipv4_address: ${PEERS_NETWORK_CADDY_ADDRESS}
      caddy:
    volumes:
      - ./volumes/Caddyfile:/etc/caddy/Caddyfile:ro
      # Go trusts every certificate file in /etc/ssl/certs, on top of the image's
      # CA bundle
      - ${EXTRA_CA_CERTIFICATE_PATH}:/etc/ssl/certs/extra-ca.crt:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - PUBLIC_RESOLVER_ADDRESS=${PUBLIC_RESOLVER_ADDRESS}
      - DYNU_API_KEY=${DYNU_API_KEY}
    restart: ${DOCKER_RESTART}

networks:
  peers:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${PEERS_NETWORK}
  caddy:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${CADDY_NETWORK}
  internet:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${INTERNET_NETWORK}

volumes:
  caddy-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/data
  caddy-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/config
