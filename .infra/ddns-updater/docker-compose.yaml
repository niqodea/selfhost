services:
  ddns-updater:
    build: .
    # Linux drops TERM sent to PID 1 unless it handles it, so tini runs as PID 1
    # and passes TERM to the shell
    init: true
    dns: ${INTERNET_NETWORK_DNS_ADDRESS}
    networks:
      internet:
    volumes:
      - ${EXTRA_CA_CERTIFICATE_PATH}:/extra-ca.crt:ro
    environment:
      DOMAIN: ${DOMAIN}
      DDNS_UPDATE_URL: ${DDNS_UPDATE_URL}
      DDNS_USERNAME: ${DDNS_USERNAME}
      DDNS_PASSWORD: ${DDNS_PASSWORD}
    restart: ${DOCKER_RESTART}

networks:
  internet:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${INTERNET_NETWORK}
