services:

  dns-main:
    build: .
    networks:
      main:
        ipv4_address: ${MAIN_NETWORK_DNS_ADDRESS}
    # Unblocked names go to Docker's resolver, which asks the host's resolvers
    command:
      - -k
      - --addn-hosts=/etc/dnsmasq.d/blocklist.hosts
      - --address=/${DOMAIN}/${MAIN_NETWORK_CADDY_ADDRESS}
      - --address=/syncthing.internal/${INTERNAL_NETWORK_SYNCTHING_ADDRESS}
      - --log-queries
      - --log-facility=${DNS_LOG_FACILITY}
    restart: ${DOCKER_RESTART}

  dns-gluetun:
    build: .
    networks:
      gluetun:
        ipv4_address: ${GLUETUN_NETWORK_DNS_ADDRESS}
    # Unblocked names go only to Gluetun, so they leave through the tunnel
    command:
      - -k
      - --addn-hosts=/etc/dnsmasq.d/blocklist.hosts
      - --no-resolv
      - --server=${GLUETUN_NETWORK_GATEWAY_ADDRESS}
      - --address=/${DOMAIN}/${MAIN_NETWORK_CADDY_ADDRESS}
      - --address=/syncthing.internal/${INTERNAL_NETWORK_SYNCTHING_ADDRESS}
      - --log-queries
      - --log-facility=${DNS_LOG_FACILITY}
    restart: ${DOCKER_RESTART}

networks:
  main:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${MAIN_NETWORK}
  gluetun:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${GLUETUN_NETWORK}
