services:

  dns-internet:
    build: .
    networks:
      internet:
        ipv4_address: ${INTERNET_NETWORK_DNS_ADDRESS}
    # Unblocked names go to Docker's resolver, which asks the host's resolvers
    command:
      - -k
      - --addn-hosts=/etc/dnsmasq.d/blocklist.hosts
      - --address=/${DOMAIN}/${PEERS_NETWORK_CADDY_ADDRESS}
      - --address=/syncthing.internal/${PEERS_NETWORK_SYNCTHING_ADDRESS}
      - --log-queries
      - --log-facility=${DNS_LOG_FACILITY}
    restart: ${DOCKER_RESTART}

  dns-gluetun:
    build: .
    networks:
      gluetun:
        ipv4_address: ${GLUETUN_NETWORK_DNS_ADDRESS}
    # Unblocked names go only to Gluetun, so they leave through the tunnel
    command:
      - -k
      - --addn-hosts=/etc/dnsmasq.d/blocklist.hosts
      - --no-resolv
      - --server=${GLUETUN_NETWORK_GATEWAY_ADDRESS}
      - --address=/${DOMAIN}/${PEERS_NETWORK_CADDY_ADDRESS}
      - --address=/syncthing.internal/${PEERS_NETWORK_SYNCTHING_ADDRESS}
      - --log-queries
      - --log-facility=${DNS_LOG_FACILITY}
    restart: ${DOCKER_RESTART}

networks:
  internet:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${INTERNET_NETWORK}
  gluetun:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${GLUETUN_NETWORK}
