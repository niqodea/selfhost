services:
  gluetun-gateway:
    build: .
    networks:
      internet:
        gw_priority: 1
      gluetun:  # NOTE: Needs to be eth0 for the iptables post-rules to work
        ipv4_address: ${GLUETUN_NETWORK_GATEWAY_ADDRESS}
    volumes:
      - gluetun-gateway-config:/gluetun
    environment:
      - UPDATER_PERIOD=24h
      - HEALTH_SERVER_ADDRESS=0.0.0.0:9999
    env_file:
      - local.env
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1  # to act as a router
    restart: ${DOCKER_RESTART}

networks:
  internet:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${INTERNET_NETWORK}
  gluetun:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${GLUETUN_NETWORK}

volumes:
  gluetun-gateway-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/config
