services:
  fake-letsencrypt:
    image: "docker.io/library/caddy:2.11.7\
      @sha256:5e5286cb37d44086d651a5363f05f43a692ce4d649d88fb1bd844579f45fa9e8"
    networks:
      internet:
        # Caddy uses Let's Encrypt's production address, and Let's Encrypt's
        # staging address when it retries, so the fake answers under both
        aliases:
          - acme-v02.api.letsencrypt.org
          - acme-staging-v02.api.letsencrypt.org
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./..exp/certificates/root.crt:/etc/caddy/root.crt:ro
      - ./..exp/certificates/root.key:/etc/caddy/root.key:ro
      # A CA keeps the accounts it registered, and Caddy reuses its account on
      # every request
      - fake-letsencrypt-data:/data
    environment:
      - PUBLIC_RESOLVER_ADDRESS=${PUBLIC_RESOLVER_ADDRESS}
    # Docker starts it on boot, before the startup service starts the apps
    restart: always

networks:
  internet:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${INTERNET_NETWORK}

volumes:
  fake-letsencrypt-data:
