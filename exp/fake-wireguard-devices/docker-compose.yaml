# A device on each WireGuard server, as a phone or a laptop would be. Each
# brings up a peer config that its server generated, as it is, and trusts exp's
# CA as a device that installed it does

services:
  fake-wireguard-lan-device:
    # No official Docker image exists, using linuxserver.io community image
    image: "lscr.io/linuxserver/wireguard:1.0.20260223-r0-ls127\
      @sha256:e2f655e1956a6db476bc879bf721f3f8bfed49c6d8fbcf39495d7ecb991d8228"
    # The device reaches the server at the host's published port, as a device
    # from outside does
    network_mode: bridge
    extra_hosts:
      - ${DOMAIN}:host-gateway
    volumes:
      # laptop is one of the peers in exp's samples
      - ./..repo/infra/wireguard-lan/volumes/config/peer_laptop/peer_laptop.conf:/config/wg_confs/wg0.conf:ro
      - ./..exp/certificates/root.crt:/root.crt:ro
    environment:
      - CURL_CA_BUNDLE=/root.crt
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1  # for wireguard routing

  fake-wireguard-wan-device:
    # No official Docker image exists, using linuxserver.io community image
    image: "lscr.io/linuxserver/wireguard:1.0.20260223-r0-ls127\
      @sha256:e2f655e1956a6db476bc879bf721f3f8bfed49c6d8fbcf39495d7ecb991d8228"
    # The device reaches the server at the host's published port, as a device
    # from outside does
    network_mode: bridge
    extra_hosts:
      - ${DOMAIN}:host-gateway
    volumes:
      # laptop is one of the peers in exp's samples
      - ./..repo/infra/wireguard-wan/volumes/config/peer_laptop/peer_laptop.conf:/config/wg_confs/wg0.conf:ro
      - ./..exp/certificates/root.crt:/root.crt:ro
    environment:
      - CURL_CA_BUNDLE=/root.crt
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1  # for wireguard routing
