# A stand-in for the server: Debian 13, with Docker from Docker's apt repo

images:
  - location: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"

# Lima installs a rootless containerd by default, which the VM does not use
containerd:
  user: false

# The host uses none of the VM's services, so none of its ports are forwarded
portForwards:
  - guestIP: "0.0.0.0"
    guestIPMustBeZero: false
    proto: any
    ignore: true

provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eux
      # Lima runs system provisioning on every boot
      if command -v docker >/dev/null; then
          exit 0
      fi
      # Ref: https://docs.docker.com/engine/install/debian/
      apt-get update
      apt-get install --yes ca-certificates curl acl
      install --mode=0755 --directory /etc/apt/keyrings
      curl --fail --silent --show-error --location https://download.docker.com/linux/debian/gpg --output /etc/apt/keyrings/docker.asc
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian trixie stable" > /etc/apt/sources.list.d/docker.list
      apt-get update
      apt-get install --yes docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
