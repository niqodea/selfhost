services:
  ddns-updater:
    image: "docker.io/qmcgaw/ddns-updater:v2.9.0\
      @sha256:ed73f1fb7ab54a8a8fa26001eecc77cc8be56cdf3fb0ca91fee831124bcbb696"
    dns: ${MAIN_NETWORK_DNS_ADDRESS}
    networks:
      main:
    volumes:
      - ddns-updater-data:/updater/data
    environment:
      CONFIG: |
        {
          "settings": [
            {
              "provider": "dynu",
              "domain": "${DOMAIN}",
              "username": "${DYNU_USERNAME}",
              "password": "${DYNU_PASSWORD}"
            }
          ]
        }
      SERVER_ENABLED: no
    restart: ${DOCKER_RESTART}

networks:
  main:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${MAIN_NETWORK}

volumes:
  ddns-updater-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/data
