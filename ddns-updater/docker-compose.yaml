services:
  ddns-updater:
    build: .
    networks:
      ddns-updater:
    volumes:
      - ${EXTRA_CA_CERTIFICATE_PATH}:/extra-ca.crt:ro
    environment:
      DOMAIN: ${DOMAIN}
      HTTPS_PROXY: http://ddns-updater-http-proxy:3128
    env_file:
      - local.env
    depends_on:
      - ddns-updater-http-proxy
    restart: ${DOCKER_RESTART}

  # ddns-updater reaches the internet only through this proxy, which allows
  # HTTPS to the domains in ./volumes/http-proxy-domains.txt
  ddns-updater-http-proxy:
    build: ./..repo/.proxies/http
    dns: ${INTERNET_NETWORK_DNS_ADDRESS}
    networks:
      internet:
        gw_priority: 1
      ddns-updater:
    volumes:
      - ./volumes/http-proxy-domains.txt:/etc/tinyproxy/domains.txt:ro
    restart: ${DOCKER_RESTART}

networks:
  ddns-updater:
    internal: true
  internet:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${INTERNET_NETWORK}
