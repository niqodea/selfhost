networks:
  main:
    name: ${COMPOSE_PROJECT_NAME}_${MAIN_NETWORK}
    ipam:
      config:
        - subnet: ${MAIN_NETWORK_SUBNET}
          ip_range: ${MAIN_NETWORK_IP_RANGE}
  gluetun:
    name: ${COMPOSE_PROJECT_NAME}_${GLUETUN_NETWORK}
    ipam:
      config:
        - subnet: ${GLUETUN_NETWORK_SUBNET}
          ip_range: ${GLUETUN_NETWORK_IP_RANGE}
  peers:
    name: ${COMPOSE_PROJECT_NAME}_${PEERS_NETWORK}
    internal: true
    ipam:
      config:
        - subnet: ${PEERS_NETWORK_SUBNET}
          ip_range: ${PEERS_NETWORK_IP_RANGE}
  caddy:
    name: ${COMPOSE_PROJECT_NAME}_${CADDY_NETWORK}
    internal: true
