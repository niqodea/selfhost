    image: "ghcr.io/librespeed/speedtest:5.5.1-alpine\
       @sha256:f68487eda17f8abb8c88a43c0b9d1a2fa4db75c2de0fee75a6c69972bb383e87"
    networks:
      webapps:
    environment:
      - MODE=standalone
      - TELEMETRY=false
