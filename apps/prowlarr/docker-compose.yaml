services:
  prowlarr:
    image: "lscr.io/linuxserver/prowlarr:version-2.3.0.5236\
      @sha256:5339e9050cfcc0cb5331e9c98610ed9d4ce70ef481a5461ea664a13dda3f1eb0"
    networks:
      prowlarr:
      webapps:
    volumes:
      - prowlarr-config:/config
    environment:
      - HTTPS_PROXY=http://prowlarr-http-proxy:3128
    depends_on:
      - prowlarr-http-proxy
    restart: ${DOCKER_RESTART}

  # Prowlarr reaches the internet only through this proxy, which leaves through
  # Gluetun and allows HTTPS to the domains in ./volumes/http-proxy-domains.txt
  prowlarr-http-proxy:
    build: ./..repo/proxies/http
    dns: ${GLUETUN_NETWORK_DNS_ADDRESS}
    networks:
      gluetun:
        gw_priority: 1
      prowlarr:
    volumes:
      - ./volumes/http-proxy-domains.txt:/etc/tinyproxy/domains.txt:ro
    restart: ${DOCKER_RESTART}

networks:
  prowlarr:
    internal: true
  gluetun:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${GLUETUN_NETWORK}
  webapps:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${WEBAPPS_NETWORK}

volumes:
  prowlarr-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/config
