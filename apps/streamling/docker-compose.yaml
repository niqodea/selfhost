services:
  streamling:
    build: .
    user: ${PUID}:${PGID}
    dns: ${GLUETUN_NETWORK_DNS_ADDRESS}
    environment:
      - TORRENTS_DIR=/torrents
      - DOWNLOADS_DIR=/downloads
    volumes:
      - ./volumes/torrents:/torrents
      - ./content/downloads:/downloads
    networks:
      gluetun:
        gw_priority: 1
      webapps:
    restart: ${DOCKER_RESTART}

networks:
  gluetun:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${GLUETUN_NETWORK}
  webapps:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${WEBAPPS_NETWORK}
