# Ref: https://github.com/immich-app/immich/releases/download/v3.3.3/docker-compose.yml
services:
  immich:
    image: "ghcr.io/immich-app/immich-server:v3.3.3\
      @sha256:bae7664ff3aa4c2c1fcbdcdd86b40b105643c5f861f3e6a770fc760089f25862"
    user: ${PUID}:${PGID}
    networks:
      immich:
      webapps:
    volumes:
      - ./volumes/data:/data
      # Your photos, which Immich shows as an external library: it indexes
      # them where they are and never moves or renames them. Read-only, so
      # Immich cannot change them
      - ./content/photos:/photos:ro
    environment:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: admin
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    depends_on:
      - immich-redis
      - immich-postgres
    restart: ${DOCKER_RESTART}

  immich-redis:
    image: "docker.io/valkey/valkey:9\
      @sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d"
    networks:
      immich:
    restart: ${DOCKER_RESTART}

  immich-postgres:
    image: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0\
      @sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"
    user: ${PUID}:${PGID}
    networks:
      immich:
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    shm_size: 128mb
    restart: ${DOCKER_RESTART}

networks:
  immich:
    internal: true
  webapps:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${WEBAPPS_NETWORK}
