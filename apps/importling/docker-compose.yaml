services:
  importling:
    build: .
    user: ${PUID}:${PGID}
    environment:
      - DOWNLOADS_DIR=/media/downloads
      - IMPORTED_DIR=/media/imported
      - STATE_FILE=/state/importling.json
    volumes:
      - ./volumes/state:/state
      # One mount for downloads and imported, since a hard link fails across
      # mounts even on one filesystem
      - ./content/media:/media
    networks:
      webapps:
    restart: ${DOCKER_RESTART}

networks:
  webapps:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${WEBAPPS_NETWORK}
