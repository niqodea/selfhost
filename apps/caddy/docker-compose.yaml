services:
  caddy:
    build:
      context: .
      args:
        CADDY_DNS_PLUGIN: ${CADDY_DNS_PLUGIN}
    user: ${PUID}:${PGID}
    networks:
      caddy:
      peers:
        ipv4_address: ${PEERS_NETWORK_CADDY_ADDRESS}
      webapps:
    volumes:
      # Go trusts every certificate file in /etc/ssl/certs, on top of the image's
      # CA bundle
      - ${EXTRA_CA_CERTIFICATE_PATH}:/etc/ssl/certs/extra-ca.crt:ro
      - ./volumes/data:/data
      - ./volumes/config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - HTTPS_PROXY=http://caddy-http-proxy:3128
      - DNS_API_TOKEN=${DNS_API_TOKEN}
    depends_on:
      - caddy-http-proxy
      - caddy-dns-proxy
    restart: ${DOCKER_RESTART}

  # Caddy reaches the internet only through these two proxies: HTTPS to the
  # domains in ./volumes/http-proxy-domains.txt, and DNS for the domain only
  caddy-http-proxy:
    build: ./..repo/proxies/http
    dns: ${INTERNET_NETWORK_DNS_ADDRESS}
    networks:
      internet:
        gw_priority: 1
      caddy:
    volumes:
      - ./volumes/http-proxy-domains.txt:/etc/tinyproxy/domains.txt:ro
    restart: ${DOCKER_RESTART}

  caddy-dns-proxy:
    build: ./..repo/proxies/dns
    networks:
      internet:
        gw_priority: 1
      caddy:
    command:
      - --server=/${DOMAIN}/${PUBLIC_RESOLVER_ADDRESS}
    restart: ${DOCKER_RESTART}

networks:
  caddy:
    internal: true
  peers:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${PEERS_NETWORK}
  webapps:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${WEBAPPS_NETWORK}
  internet:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${INTERNET_NETWORK}
