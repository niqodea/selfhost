services:
  catalogling:
    build: .
    user: ${PUID}:${PGID}
    environment:
      - WAITING_DIR=/media/imported
      - SHOWS_DIR=/media/shows
      - STATE_FILE=/state/catalogling.json
    volumes:
      - ./volumes/state:/state
      # One mount for the waiting shows and the library, since a rename fails
      # across mounts even on one filesystem
      - ./content/media:/media
    networks:
      webapps:
    restart: ${DOCKER_RESTART}

networks:
  webapps:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${WEBAPPS_NETWORK}
