services:
  git:
    build:
      args:
        ROOT: /var/www/git
    networks:
      caddy:
        aliases: ["${CADDY_NETWORK_GIT_ALIAS}"]
    volumes:
      - ./volumes/root:/var/www/git
    user: ${PUID}:${PGID}
    restart: ${DOCKER_RESTART}

networks:
  caddy:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${CADDY_NETWORK}
