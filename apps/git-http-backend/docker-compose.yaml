services:
  git-http-backend:
    pull_policy: build
    build:
      args:
        # TODO: refactor this as a runtime setting, not build time
        ROOT: /var/www/git
    networks:
      caddy:
        aliases: ["${CADDY_NETWORK_GIT_HTTP_BACKEND_ALIAS}"]
    volumes:
      - ./volumes/root:/var/www/git
    restart: ${DOCKER_RESTART}

networks:
  caddy:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${CADDY_NETWORK}
