# The container generates configs starting from templates in /config/templates
# Ref: https://github.com/linuxserver/docker-wireguard/tree/v1.0.20210914-ls126?tab=readme-ov-file#server-mode
[Interface]
Address = ${INTERFACE}.1
ListenPort = 51820
PrivateKey = $(cat /config/server/privatekey-server)
PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth+ -j MASQUERADE
# Allow SSH connection to Docker host through VPN
PostUp = iptables -t nat -A PREROUTING -d ${INTERFACE}.1 -p tcp --dport 22 -j DNAT --to-destination 172.17.0.1:22
# Custom hack to redirect Google's DNS to our local DNS server
# Wireguard Android is not able to change the DNS setup of some phones, which is Google's 8.8.8.8 / 8.8.4.4
# Remember to also set the Wireguard client's DNS to match Google's for full compliance
PostUp = iptables -t nat -A PREROUTING -i %i -d 8.8.8.8,8.8.4.4 -j DNAT --to-destination ${INTERFACE}.1
# No need for PostDown, IP tables are wiped by stopping the container
