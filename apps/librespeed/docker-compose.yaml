services:
  librespeed:
    image: "ghcr.io/librespeed/speedtest:5.5.1-alpine\
       @sha256:f68487eda17f8abb8c88a43c0b9d1a2fa4db75c2de0fee75a6c69972bb383e87"
    networks:
      caddy:
        aliases: ["${CADDY_NETWORK_LIBRESPEED_ALIAS}"]
    environment:
      - MODE=standalone
      - TELEMETRY=false
    env_file:
      - common.env
    # Not setting user: PUID/PGID - image expects root for entrypoint setup
    # No volumes mounted so root permissions pose minimal risk
    restart: ${DOCKER_RESTART}

networks:
  caddy:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${CADDY_NETWORK}
