services:
  syncthing:
    image: "docker.io/syncthing/syncthing:2.0.14\
      @sha256:6d2ab058383b533e045cf2c32fc4c6bbe87c612c92bc2aca9f552fb099b2e123"
    user: ${PUID}:${PGID}
    networks:
      peers:
        gw_priority: 1
        ipv4_address: ${PEERS_NETWORK_SYNCTHING_ADDRESS}
      webapps:
    volumes:
      - ./content/data:/var/syncthing
    restart: ${DOCKER_RESTART}

networks:
  webapps:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${WEBAPPS_NETWORK}
  peers:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${PEERS_NETWORK}
