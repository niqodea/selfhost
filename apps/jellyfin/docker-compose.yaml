services:
  jellyfin:
    image: "docker.io/jellyfin/jellyfin:10.11.6\
      @sha256:333b647716631443a43c7fabac4b0c46b4e2f036bad19547e00958f10f721b85"
    networks:
      main:
        gw_priority: 1
      caddy:
        aliases: ["${CADDY_NETWORK_JELLYFIN_ALIAS}"]
    volumes:
      - ./volumes/config:/config
      - ./volumes/cache:/cache
      - ./volumes/movies:/data/movies
      - ./volumes/shows:/data/shows
    env_file:
      - common.env
    user: ${PUID}:${PGID}
    restart: ${DOCKER_RESTART}

networks:
  main:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${MAIN_NETWORK}
  caddy:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${CADDY_NETWORK}
