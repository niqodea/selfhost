services:
  jellyfin:
    image: "docker.io/jellyfin/jellyfin:10.11.6\
      @sha256:333b647716631443a43c7fabac4b0c46b4e2f036bad19547e00958f10f721b85"
    user: ${PUID}:${PGID}
    networks:
      jellyfin:
      webapps:
    volumes:
      - ./volumes/config:/config
      - ./volumes/cache:/cache
      - ./content/movies:/data/movies
      - ./content/shows:/data/shows
    environment:
      - HTTPS_PROXY=http://jellyfin-http-proxy:3128
    depends_on:
      - jellyfin-http-proxy
    restart: ${DOCKER_RESTART}

  # Jellyfin reaches the internet only through this proxy, which allows HTTPS to
  # the domains in ./volumes/http-proxy-domains.txt and refuses everything else
  jellyfin-http-proxy:
    build: ./..repo/proxies/http
    dns: ${INTERNET_NETWORK_DNS_ADDRESS}
    networks:
      internet:
        gw_priority: 1
      jellyfin:
    volumes:
      - ./volumes/http-proxy-domains.txt:/etc/tinyproxy/domains.txt:ro
    restart: ${DOCKER_RESTART}

networks:
  jellyfin:
    internal: true
  internet:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${INTERNET_NETWORK}
  webapps:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${WEBAPPS_NETWORK}
