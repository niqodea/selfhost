# A fake VPN provider for exp's Gluetun. Traffic leaves through this machine's
# own internet connection. The keys are public and used nowhere else
[Interface]
Address = 10.255.254.1/24
ListenPort = 51820
PrivateKey = ADW1fUa/WV6umyHhinGb+LiNz1iOyUV/2sWY74v6JFA=
PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth+ -j MASQUERADE
# Replies sized for the internet's 1500 byte packets do not fit the tunnel, so
# TCP connections are told a smaller segment size when they open
PostUp = iptables -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu

[Peer]
# Gluetun
PublicKey = 60MTtIuK0Fq4XkBfWpZ1LRXou+K4EVxNp3289JmXf3Q=
AllowedIPs = 10.255.254.2/32
