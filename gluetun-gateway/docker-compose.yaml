services:
  gluetun-gateway:
    image: "docker.io/qmcgaw/gluetun:v3.41.0\
      @sha256:6b54856716d0de56e5bb00a77029b0adea57284cf5a466f23aad5979257d3045"
    networks:
      main:
        gw_priority: 1
      gluetun:  # NOTE: Needs to be eth0 for iptables volume to work
        ipv4_address: ${GLUETUN_NETWORK_GATEWAY_ADDRESS}
    volumes:
      - ./volumes/iptables-post-rules.txt:/iptables/post-rules.txt:ro
      - gluetun-gateway-config:/gluetun
    environment:
      - UPDATER_PERIOD=24h
      - HEALTH_SERVER_ADDRESS=0.0.0.0:9999
    env_file:
      - local.env
    cap_add:
      - NET_ADMIN
    # Without it, Gluetun creates the device node itself, which a container on
    # rootless Docker is not allowed to do
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1  # to act as a router
    restart: ${DOCKER_RESTART}

networks:
  main:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${MAIN_NETWORK}
  gluetun:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${GLUETUN_NETWORK}

volumes:
  gluetun-gateway-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/config
