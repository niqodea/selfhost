# The container generates configs starting from templates in /config/templates
# Ref: https://github.com/linuxserver/docker-wireguard/tree/1.0.20260223-r0-ls127?tab=readme-ov-file#server-mode
[Interface]
Address = ${INTERFACE}.1
ListenPort = 51820
PrivateKey = $(cat /config/server/privatekey-server)
# A guest's device may be compromised, so forward its traffic only to Caddy and
# to the DNS server
PostUp = iptables -A FORWARD -i %i -d ${PEERS_NETWORK_CADDY_ADDRESS} -j ACCEPT
PostUp = iptables -A FORWARD -i %i -m conntrack --ctstate DNAT -j ACCEPT
PostUp = iptables -A FORWARD -i %i -j DROP
PostUp = iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth+ -j MASQUERADE
# Forward the DNS queries that peers send to this server to the upstream DNS server
PostUp = iptables -t nat -A PREROUTING -i %i -d ${INTERFACE}.1 -p udp --dport 53 -j DNAT --to-destination ${UPSTREAM_DNS_ADDRESS}
PostUp = iptables -t nat -A PREROUTING -i %i -d ${INTERFACE}.1 -p tcp --dport 53 -j DNAT --to-destination ${UPSTREAM_DNS_ADDRESS}
# No need for PostDown, IP tables are wiped by stopping the container
