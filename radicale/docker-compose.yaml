services:
  radicale:
    image: "docker.io/tomsquest/docker-radicale:3.4.1.0\
      @sha256:8b50b8c664d9557e47f723e18064d8f5f822e39d4e8a3d2385947ee13a2f8222"
    networks:
      caddy:
    volumes:
      - radicale-data:/data
    restart: ${DOCKER_RESTART}

networks:
  caddy:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${CADDY_NETWORK}

volumes:
  radicale-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/data
