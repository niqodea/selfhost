# The container generates configs starting from templates in /config/templates
# Ref: https://github.com/linuxserver/docker-wireguard/tree/v1.0.20210914-ls126?tab=readme-ov-file#server-mode
[Interface]
Address = ${INTERFACE}.1
ListenPort = 51820
PrivateKey = $(cat /config/server/privatekey-server)
# A device decides what it sends into the tunnel, so the server forwards only
# what goes to the apps, and what this server redirects
PostUp = iptables -A FORWARD -i %i -d ${PEERS_NETWORK_SUBNET} -j ACCEPT
PostUp = iptables -A FORWARD -i %i -m conntrack --ctstate DNAT -j ACCEPT
PostUp = iptables -A FORWARD -i %i -j DROP
PostUp = iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth+ -j MASQUERADE
# Allow SSH connection to Docker host through VPN
PostUp = iptables -t nat -A PREROUTING -d ${INTERFACE}.1 -p tcp --dport 22 -j DNAT --to-destination 172.17.0.1:22
# Custom hack to redirect Google's DNS to our local DNS server
# Wireguard Android is not able to change the DNS setup of some phones, which is Google's 8.8.8.8 / 8.8.4.4
# Remember to also set the Wireguard client's DNS to match Google's for full compliance
PostUp = iptables -t nat -A PREROUTING -i %i -d 8.8.8.8,8.8.4.4 -j DNAT --to-destination ${UPSTREAM_DNS_ADDRESS}
# Forward the DNS queries that peers send to this server to the upstream DNS server
PostUp = iptables -t nat -A PREROUTING -i %i -d ${INTERFACE}.1 -p udp --dport 53 -j DNAT --to-destination ${UPSTREAM_DNS_ADDRESS}
PostUp = iptables -t nat -A PREROUTING -i %i -d ${INTERFACE}.1 -p tcp --dport 53 -j DNAT --to-destination ${UPSTREAM_DNS_ADDRESS}
# No need for PostDown, IP tables are wiped by stopping the container
