services:

  wireguard-lan:
    # No official Docker image exists, using linuxserver.io community image
    image: "lscr.io/linuxserver/wireguard:v1.0.20210914-ls126\
      @sha256:a27dc2b63245fa1c20fc55edf9aebf7cf3add71000557177c9fa62dba65b5d29"
    dns: ${INTERNET_NETWORK_DNS_ADDRESS}
    networks:
      internet:
        gw_priority: 1
      peers:
    ports:
      - ${WIREGUARD_LAN_HOST_PORT}:51820/udp
    volumes:
      # The image reads the template only from this path, inside the saved
      # /config. A template built into the image would reach only a fresh
      # install, so the mount is what keeps the template current
      # Ref: https://github.com/linuxserver/docker-wireguard/blob/v1.0.20210914-ls126/root/etc/s6-overlay/s6-rc.d/init-wireguard-confs/run
      # read-only mount causes harmless chown warning at startup
      - ./volumes/server-template.conf:/config/templates/server.conf:ro
      - wireguard-lan-config:/config
    environment:
      - SERVERURL=${DOMAIN}
      - SERVERPORT=${WIREGUARD_LAN_HOST_PORT}
      - INTERNAL_SUBNET=${WIREGUARD_NETWORK_SUBNET}
      - ALLOWEDIPS=${WIREGUARD_NETWORK_SERVER_ADDRESS}/32,${PEERS_NETWORK_SUBNET}
      # Disable default DNS server since peers' DNS goes to the stack's resolver
      # Ref: https://github.com/linuxserver/docker-wireguard/issues/62#issuecomment-2010533285
      - USE_COREDNS=false
      # The stack's resolver is not on the peers network, so that the containers
      # there cannot send data out through DNS. Peers ask this server instead,
      # which forwards their queries to the resolver, see
      # ./volumes/server-template.conf for how
      - PEERDNS=${WIREGUARD_NETWORK_SERVER_ADDRESS}
      - STACK_RESOLVER_ADDRESS=${INTERNET_NETWORK_DNS_ADDRESS}
    env_file:
      - local.env
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1  # for wireguard routing
    restart: ${DOCKER_RESTART}

networks:
  internet:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${INTERNET_NETWORK}
  peers:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${PEERS_NETWORK}

volumes:
  wireguard-lan-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/config
