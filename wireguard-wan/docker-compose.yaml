services:

  wireguard-wan:
    # No official Docker image exists, using linuxserver.io community image
    image: "lscr.io/linuxserver/wireguard:v1.0.20210914-ls126\
      @sha256:a27dc2b63245fa1c20fc55edf9aebf7cf3add71000557177c9fa62dba65b5d29"
    dns: ${GLUETUN_NETWORK_DNS_ADDRESS}
    networks:
      gluetun:
        gw_priority: 1
      main:
        ipv4_address: ${MAIN_NETWORK_WIREGUARD_WAN_ADDRESS}
      internal:
    # NOTE: Port forwarding omitted.
    # Docker's port forwarding uses the network gateway, which routes through
    # gluetun's tunnel in this setup, breaking connections back to clients.
    # We handle port forwarding manually on the host to enable port forwarding
    # via main network instead, see ./route for how.
    # ports:
    #   - ${WIREGUARD_WAN_HOST_PORT}:51820/udp
    volumes:
      # read-only mount causes harmless chown warning at startup
      - ./volumes/server-template.conf:/config/templates/server.conf:ro
      - wireguard-wan-config:/config
    environment:
      - SERVERURL=${DOMAIN}
      - SERVERPORT=${WIREGUARD_WAN_HOST_PORT}
      - INTERNAL_SUBNET=${WIREGUARD_NETWORK_SUBNET}
      # Tunnel everything through vpn
      - ALLOWEDIPS=0.0.0.0/0  # or 0.0.0.0/1,128.0.0.0/1 for Windows clients
      # Disable default DNS server since we run dnsmasq instead
      # Ref: https://github.com/linuxserver/docker-wireguard/issues/62#issuecomment-2010533285
      - USE_COREDNS=false
    env_file:
      - local.env
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1  # for wireguard routing
    restart: ${DOCKER_RESTART}

  wireguard-wan-dnsmasq:
    image: "docker.io/strm/dnsmasq\
      @sha256:dcf4c0aeb69ea6b9bca81314449d732ecd2ea021588d8a34d4be7c2304f89a39\
    "  # untagged, the only available image for now (version 2.80)
    network_mode: service:wireguard-wan
    command:
      - -k
      - --interface=wg0
      - --address=/${DOMAIN}/${MAIN_NETWORK_CADDY_ADDRESS}
      - --address=/syncthing.internal/${INTERNAL_NETWORK_SYNCTHING_ADDRESS}
      - --log-queries
      - --log-facility=${WIREGUARD_DNSMASQ_LOG_FACILITY}
    # Started as root, dnsmasq 2.80 fails with "setting capabilities failed"
    user: nobody
    restart: ${DOCKER_RESTART}

networks:
  gluetun:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${GLUETUN_NETWORK}
  main:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${MAIN_NETWORK}
  internal:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_${INTERNAL_NETWORK}

volumes:
  wireguard-wan-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/config
